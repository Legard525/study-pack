<!doctype html>
<!-- study-pack HTML fallback. Copy, set lang + title, write content, then: scripts/html_to_pdf.sh in.html out.pdf
     Cheat sheet: <body class="landscape cols3">. Math: $...$ inline, $$...$$ display (KaTeX). Graphs: inline SVG. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Study pack</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})"></script>
<style>
  @page { size: A4; margin: 18mm 20mm; }
  body.landscape { }
  @page landscape { size: A4 landscape; margin: 11mm; }
  :root { --accent:#164687; --idea:#00786e; --trap:#be5000; --ex:#3c6e1e; --gray:#969696; }
  body { font: 10.5pt/1.42 "PT Serif", Georgia, "Times New Roman", serif; color:#111; background:#fff; margin:0; }
  body.landscape { page: landscape; font-size: 8.6pt; line-height: 1.3; }
  body.cols3 main { column-count: 3; column-gap: 14px; }
  header.run { display:flex; justify-content:space-between; font:8pt sans-serif; color:var(--gray);
               border-bottom:.3pt solid #333; padding-bottom:2px; margin-bottom:10px; }
  h1 { font: 700 18pt sans-serif; color: var(--accent); margin: 0 0 6px; }
  h2 { font: 700 14pt sans-serif; color: var(--accent); margin: 16px 0 6px; break-after: avoid; }
  h3 { font: 700 11.5pt sans-serif; color: var(--accent); margin: 12px 0 4px; break-after: avoid; }
  .box { border: .6pt solid; border-radius: 2px; margin: 6px 0; break-inside: avoid; }
  .box > .t { font: 700 8.5pt sans-serif; color: #fff; padding: 2px 6px; }
  .box > .b { padding: 4px 6px; }
  .defn  { border-color: var(--accent); background: #f4f6fa; } .defn > .t  { background: #5c7fae; }
  .idea  { border-color: var(--idea);   background: #f2f9f8; } .idea > .t  { background: #3f9a91; }
  .trap  { border-color: var(--trap);   background: #fdf6f2; } .trap > .t  { background: #cc7333; }
  .method{ border-color: var(--idea);   background: #f7fbfb; } .method > .t{ background: #66aca5; }
  .task  { border-color: var(--ex);     background: #f5f8f3; } .task > .t  { background: #6b9a54; }
  .exmpl { border-color: var(--ex);     background: #f9fbf8; } .exmpl > .t { background: #95b385; }
  .key   { border-color: var(--accent); background: #ebf0f6; } .key > .t   { background: var(--accent); }
  .srcerr{ border-color: var(--trap);   background: #fefaf7; } .srcerr > .t{ background: #d9955f; }
  .ans { background: #e6ecf4; padding: 3px 6px; margin: 4px 0; }
  .ans::before { content: attr(data-label) " "; font-weight: 700; }
  table { border-collapse: collapse; } td, th { padding: 1px 6px; } thead th { border-bottom: .6pt solid #333; }
  ul, ol { margin: 2px 0; padding-left: 1.3em; }
  svg { max-width: 100%; display: block; break-inside: avoid; }
  p { orphans: 3; widows: 3; }
  .box.task, .box.method { break-after: avoid; }
  /* Keep together only small units (a box, a figure). Never wrap a whole problem or section in
     break-inside: avoid; that pushes each problem onto its own half-empty page. */
</style>
</head>
<body>
<header class="run"><span>Course · Chapter</span><span>Deliverable</span></header>
<main>
<h1>Title</h1>

<div class="box defn"><div class="t">Definition</div><div class="b">…</div></div>
<div class="box task"><div class="t">Problem 1</div><div class="b">…</div></div>
<p><b>Solution.</b> …</p>
<div class="ans" data-label="Answer:">$x = 1$</div>
<div class="box trap"><div class="t">Trap</div><div class="b">…</div></div>

</main>
</body>
</html>
